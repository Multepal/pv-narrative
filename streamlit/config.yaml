sidebar:
  min_width_px: 280
  width_vw: 25

sources:
  ajtzibab:
    lang: quc
    label: "Ajtzibab 2025"
  christenson:
    lang: quc
    label: "Christenson 2007"
  colop:
    lang: quc
    label: "Colop 2012"
  christenson_ximenez:
    lang: quc
    label: "Christenson's Ximénez"
  ximenez:
    lang: quc
    label: "Ximénez"
  recinos:
    lang: spa
    label: "Recinos 1947"
  tedlock:
    lang: eng
    label: "Tedlock 1983"
  christenson_english_prose:
    lang: eng
    label: "Christenson's Prose"

languages:
  quc: "K'iche'"
  spa: Spanish
  eng: English

# Language of the original text; editions in other languages are translations.
source_lang: quc

# Narrative divisions as Christenson chapter numbers (the chapter where each division starts;
# chapter 1 = start of text). Used by Editors' Divisions.
divisions:
  # Editions whose DOCMAP carries Christenson's chapter numbers (chap_num): positions are exact.
  # Other editions are compared by relative position against Christenson's K'iche' text.
  chapter_editions: [christenson, christenson_english_prose]
  # The project's own 8 interpretive divisions, used by the Text Reader, Narrative Play,
  # Chapter Topics and Editors' Divisions. Not independent of the models.
  author:
    - {label: "First Creation",        chap: 1,  title: "First Creation"}
    - {label: "7 Macaw",               chap: 9,  title: "7 Macaw"}
    - {label: "Father",                chap: 15, title: "About the Two Boys' Father"}
    - {label: "Mother",                chap: 19, title: "About the Two Boys' Mother"}
    - {label: "Two Boys Defeat Death", chap: 22, title: "The Two Boys Defeat Death"}
    - {label: "Second Creation",       chap: 41, title: "The Second Creation"}
    - {label: "Religion",              chap: 48, title: "Religion"}
    - {label: "Politics",              chap: 65, title: "Politics"}
  # Part starts by edition, from the Obsidian note "Alignments of parts among editions".
  # Independent of this project: the external test. (Brasseur and Recinos part IV at 57 is
  # marked * in the note.)
  editors:
    "Brasseur 1861": [1, 15, 41, 57]
    "Recinos 1947":  [2, 15, 41, 57]    # preamble not included in parts
    "Edmonson 1971": [1, 9, 15, 41]
    "Tedlock 1985":  [1, 10, 15, 41, 65]
    "Colop 2011":    [1, 9, 15, 41, 65]
    "Bazzett 2018":  [1, 9, 15, 41]
    "Sotelo 2018":   [1, 22, 41, 57]

controls:
  default_source: ajtzibab
  chunk_pct:
    min: 0.005
    max: 0.250
    default: 0.03
    step: 0.005
  overlap:
    min: 0.0
    max: 0.9
    default: 0.0
    step: 0.05
  min_df:
    min: 1
    max: 20
    default: 5
    step: 1
  max_df:
    min: 0.1
    max: 1.0
    default: 0.5
    step: 0.05
  n_topics:
    min: 2
    max: 20
    default: 6
    step: 1
  lsa_n_components:
    default: 6
  n_chunks:
    min: 5
    max: 100
    default: 33
    step: 1
  n_clusters:
    min: 2
    max: 20
    default: 6    # reporting k: k* from Choose k (ARI Grid Search), stable across methods and the grid
    step: 1
  boundary_tol_chunks:  # cross-edition boundary F1: boundaries match within ± this many chunks
    min: 0
    max: 3
    default: 1
    step: 1
  chapter_tol:          # Editors' Divisions, chapter resolution: ± chapters
    min: 0
    max: 2
    default: 0
    step: 1
  resonance_window:     # Editors' Divisions: chunks on each side for novelty/transience
    default: 3          # (Barron et al. 2018); peaks are stable for w = 2–4
  k_selection_pairs:    # grid searches choose k on these pairs: within (translations held out) | all
    default: within
  min_chunks_per_cluster: 3   # grid searches skip k > n_chunks / this; near-singleton partitions
                              # agree trivially (k* = 6 is stable for values 2–4)
  k_selection_min: 3          # grid searches choose k* among k >= this. k = 2 measures only the
                              # primary division (a real peak for boundary F1); it is still plotted
                              # and listed among the local peaks
  n_top_words:
    min: 3
    max: 15
    default: 7
    step: 1
  ngram_range:
    min_n: 1
    max_n: 4
    default_min: 1
    default_max: 1

model:
  nmf_max_iter: 2000
  random_state: 42   # NMF's nndsvda init uses a randomized SVD; fix it for reproducible topics
  # Tokens are the parser's term_str values (space-joined into chunk documents). sklearn's
  # default \b\w\w+\b splits K'iche' words at the glottal-stop apostrophe (k'ajolom → ajolom)
  # and drops one-letter words; \S+ keeps whole tokens, as local_lib's NarrativeParser does.
  token_pattern: '\S+'

layout:
  max_width_px: 1400
  column_ratios: [2, 1.5, 1.2, 1.2, 1.2, 1.2, 1.2]
  heatmap_height: 400
  heatmap_row_height_px: 30
  bar_height: 200
  margin:
    l: 80
    r: 150
    t: 20
    b: 75

visualization:
  heatmap_color_scale: YlGnBu
  colorscale_ari: Blues
  colorscale_pca: RdBu_r
  colorscale_cluster: Greens
  colorscale_boundary: RdYlGn
  colorscale_transitions: Oranges
  wordcloud_colormap: Blues
  wordcloud_width: 400
  wordcloud_height: 250
  wordcloud_prefer_horizontal: 0.9
  wordcloud_cols: 4
  preview_len: 300
  wrap_width: 60
  hover_top_words: 5
