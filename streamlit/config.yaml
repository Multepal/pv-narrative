app:
  page_title: "Narrative Structure of the Popol Wuj"
  page_icon: "📜"
  title: "The Narrative Structure of the Popol Wuj"
  layout: wide

pages:
  - path: pages/chunk_clustering.py
    title: Hierarchical Clustering
    icon: "🔗"
  # - path: pages/explorer.py
  #   title: Topic Modeling
  #   icon: "📜"
  - path: pages/model_diagnostics.py
    title: Topic Modeling
    icon: "⚙️"
  # - path: pages/about.py
  #   title: About
  #   icon: "ℹ️"

sidebar:
  min_width_px: 280
  width_vw: 25

sources:
  ajtzibab:
    lang: quc
    label: "Ajtzibab 2025"
  christenson:
    lang: quc
    label: "Christenson 2007"
  colop:
    lang: quc
    label: "Colop 2012"
  christenson_ximenez:
    lang: quc
    label: "Christenson's Ximénez"
  ximenez:
    lang: quc
    label: "Ximénez"
  recinos:
    lang: spa
    label: "Recinos 1947"
  tedlock:
    lang: eng
    label: "Tedlock 1983"
  christenson_english_prose:
    lang: eng
    label: "Christenson's Prose"

languages:
  quc: "K'iche'"
  spa: Spanish
  eng: English

controls:
  default_source: ajtzibab
  chunk_pct:
    min: 0.005
    max: 0.250
    default: 0.03
    step: 0.005
  overlap:
    min: 0.0
    max: 0.9
    default: 0.0
    step: 0.05
  min_df:
    min: 1
    max: 20
    default: 5
    step: 1
  max_df:
    min: 0.1
    max: 1.0
    default: 0.5
    step: 0.05
  n_topics:
    min: 2
    max: 20
    default: 6
    step: 1
  n_clusters:
    min: 2
    max: 20
    default: 6
    step: 1
  n_top_words:
    min: 3
    max: 15
    default: 7
    step: 1
  ngram_range:
    min_n: 1
    max_n: 4
    default_min: 1
    default_max: 1

model:
  nmf_max_iter: 2000

layout:
  max_width_px: 1400
  column_ratios: [2, 1.5, 1.2, 1.2, 1.2, 1.2, 1.2]
  heatmap_height: 400
  heatmap_row_height_px: 30
  bar_height: 200
  margin:
    l: 80
    r: 150
    t: 20
    b: 75

visualization:
  heatmap_color_scale: YlGnBu
  wordcloud_colormap: Blues
  wordcloud_width: 400
  wordcloud_height: 250
  wordcloud_prefer_horizontal: 0.9
  wordcloud_cols: 4
  preview_len: 300
  wrap_width: 60
  hover_top_words: 5
