app:
  page_title: "Narrative Structure of the Popol Wuj"
  page_icon: "📜"
  title: "The Narrative Structure of the Popol Wuj"
  layout: wide

pages:
  # ── Single-edition analysis ───────────────────────────────────────────────
  - path: pages/chunk_clustering_nc.py
    title: Clustering (TF-IDF)
    icon: "🔗"
  - path: pages/chunk_clustering_sim.py
    title: Clustering (Cosine-Sim)
    icon: "🔗"
  - path: pages/model_diagnostics_nc.py
    title: Topics (NMF)
    icon: "⚙️"
  - path: pages/pca_lsa.py
    title: Clustering (LSA)
    icon: "🔬"
  # ── Cross-edition comparison ──────────────────────────────────────────────
  - path: pages/cluster_comparison.py
    title: Cross-Edition Comparison
    icon: "📊"
  # ── Parameter optimization ────────────────────────────────────────────────
  - path: pages/grid_search_ari.py
    title: Grid Search (ARI)
    icon: "🔍"
  - path: pages/grid_search_boundary.py
    title: Grid Search (Boundary)
    icon: "🔍"
  # ── Text reader & structural analysis ───────────────────────────────────
  - path: pages/christenson_reader.py
    title: Christenson Text Reader
    icon: "📖"
  - path: pages/narrative_play.py
    title: Narrative Play
    icon: "🎯"
  - path: pages/chapter_topics.py
    title: Chapter Topics
    icon: "📐"
  # ── Temporal / spectral analysis ──────────────────────────────────────────
  - path: pages/dct_analysis.py
    title: Narrative DCT
    icon: "〰️"
  - path: pages/narrative_transitions.py
    title: Narrative Transitions
    icon: "🔀"
  - path: pages/episode_boundaries.py
    title: Episode Boundaries
    icon: "📍"
  - path: pages/tema_distribution.py
    title: Tema Distribution
    icon: "🧩"
  - path: pages/annotation_coverage.py
    title: Annotation Coverage
    icon: "🔎"
  # ── Legacy (chunk-% variants, superseded by n-chunks) ─────────────────────
  # - path: pages/chunk_clustering.py
  #   title: Clustering (TF-IDF, chunk %)
  #   icon: "🔗"
  # - path: pages/model_diagnostics.py
  #   title: Topics (NMF, chunk %)
  #   icon: "⚙️"
  # - path: pages/grid_search.py
  #   title: Grid Search (TF-IDF, Hamming)
  #   icon: "🔍"
  # - path: pages/about.py
  #   title: About
