app:
  page_title: "Narrative Structure of the Popol Wuj"
  page_icon: "📜"
  title: "The Narrative Structure of the Popol Wuj"
  layout: wide

pages:
  # Sidebar sections follow the argument: model → choose k → test, then the two axes of
  # Lévi-Strauss's reading — paradigmatic (structure) and syntagmatic (event), each with an
  # external check (temas; editors' divisions) — then prediction, then supporting resources.
  "1 · Model":
    - path: pages/chunk_clustering_nc.py
      title: Clustering (TF-IDF)
      icon: "🔗"
  "2 · Choose k":
    - path: pages/grid_search_ari.py
      title: Choose k (ARI Grid Search)
      icon: "🔍"
  "3 · Test":
    - path: pages/cluster_comparison.py
      title: Cross-Edition Comparison
      icon: "📊"
    - path: pages/chunk_clustering_sim.py
      title: Robustness (Cosine-Sim Clustering)
      icon: "🔗"
  "4 · Paradigmatic Axis":
    - path: pages/pca_lsa.py
      title: Relations (PCA / LSA)
      icon: "🔬"
    - path: pages/model_diagnostics_nc.py
      title: Content (NMF Topics)
      icon: "⚙️"
    - path: pages/tema_distribution.py
      title: Temas (Thematic Check)
      icon: "🧩"
  "5 · Syntagmatic Axis":
    # Segmentation: where the cuts fall, checked against the editors
    - path: pages/grid_search_boundary.py
      title: Boundary Agreement (Grid Search)
      icon: "🔍"
    - path: pages/episode_boundaries.py
      title: Episode Boundaries
      icon: "📍"
    - path: pages/division_validation.py
      title: Editors' Divisions
      icon: "✅"
    - path: pages/narrative_play.py
      title: Narrative Play
      icon: "🎯"
    # Sequence: what follows what, and how classes recur
    - path: pages/narrative_transitions.py
      title: Narrative Transitions
      icon: "🔀"
    - path: pages/dct_analysis.py
      title: Narrative DCT
      icon: "〰️"
  "6 · Prediction":
    - path: pages/chapter_topics.py
      title: Chapter Topics
      icon: "📐"
    - path: pages/christenson_reader.py
      title: Christenson Text Reader
      icon: "📖"
  "Resources":
    - path: pages/annotation_coverage.py
      title: Annotation Coverage
      icon: "🔎"
    - path: pages/entity_index.py
      title: Entity Index
      icon: "🗂️"
  # ── Legacy (chunk-% variants, superseded by n-chunks; not shown) ─────────
  # - path: pages/chunk_clustering.py
  #   title: Clustering (TF-IDF, chunk %)
  #   icon: "🔗"
  # - path: pages/model_diagnostics.py
